<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>曇天ズ - レイアウト変更版</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background-color: #ffffff;
    font-family: sans-serif;
    /* スマホで画面全体を固定 */
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    touch-action: none; 
  }
  
  /* 上部ヘッダー（ロゴとスコア） */
  #header {
    display: flex;
    padding: 10px;
    gap: 10px;
    height: 80px;
    box-sizing: border-box;
  }
  .header-box {
    flex: 1;
    background-color: #fce25d; /* レイアウト図の黄色 */
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 20px;
    color: #000;
  }
  .score-text {
    font-size: 16px;
    margin-top: 4px;
  }

  /* 中央ゲーム画面 */
  #game-wrapper {
    flex: 1;
    margin: 0 10px;
    background-color: #fce25d;
    border-radius: 8px;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    background-color: #fff8d6; /* ゲームの背景色（少し薄い黄色） */
    display: block;
    width: 100%;
    height: 100%;
  }

  /* 下部操作スペース */
  #control-space {
    height: 120px; /* 操作スペースの高さ */
    margin: 10px;
    background-color: #fce25d;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-weight: bold;
    color: #000;
    user-select: none;
    -webkit-user-select: none;
    cursor: pointer;
  }

  /* ゲームオーバー画面 */
  #gameover {
    display: none;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.8);
    color: white;
    padding: 20px;
    text-align: center;
    border-radius: 10px;
    width: 80%;
  }
  #gameover button {
    padding: 10px 20px;
    font-size: 16px;
    margin-top: 15px;
    cursor: pointer;
  }
</style>
</head>
<body>

<!-- 上部 -->
<div id="header">
  <div class="header-box">
    曇天ズ
  </div>
  <div class="header-box">
    <div>SCORE: <span id="scoreText">0</span></div>
    <div class="score-text">HP: <span id="hpText">100</span></div>
  </div>
</div>

<!-- 中央 -->
<div id="game-wrapper">
  <canvas id="gameCanvas"></canvas>
  <div id="gameover">
    <h2>体力切れ...</h2>
    <p>最終スコア: <span id="finalScore"></span></p>
    <button onclick="location.reload()">もう一度走る</button>
  </div>
</div>

<!-- 下部 -->
<div id="control-space">
  操作スペース<br>（左右になぞる）
</div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const gameWrapper = document.getElementById('game-wrapper');

  // キャンバスのサイズを親要素（黄色い枠）に合わせる
  function resizeCanvas() {
    canvas.width = gameWrapper.clientWidth;
    canvas.height = gameWrapper.clientHeight;
  }
  resizeCanvas(); // 初期化
  window.addEventListener('resize', resizeCanvas); // 画面回転時などに対応

  // UI要素
  const scoreText = document.getElementById('scoreText');
  const hpText = document.getElementById('hpText');
  const gameOverScreen = document.getElementById('gameover');
  const finalScoreText = document.getElementById('finalScore');
  const controlSpace = document.getElementById('control-space');

  // ゲーム状態
  let isGameOver = false;
  let score = 0;
  let hp = 100;
  let frameCount = 0;
  let gameSpeed = 4;

  // プレイヤー（曇天ズ）
  const player = {
    width: 40,
    height: 40,
    x: canvas.width / 2, // 初期位置は中央
    color: '#0055ff' // 青色
  };

  let objects = [];

  // --------------------------------------------------
  // 入力処理（操作スペースのみで受け付ける）
  // --------------------------------------------------
  function movePlayer(clientX) {
    const rect = controlSpace.getBoundingClientRect();
    // 操作スペース内のX座標（0 〜 要素の幅）を取得
    let relativeX = clientX - rect.left;
    
    // 操作スペースの横幅に対する割合（0.0 〜 1.0）を計算
    let ratio = relativeX / rect.width;
    
    // 割合をキャンバスの幅に変換してプレイヤーのX座標とする
    let targetX = ratio * canvas.width;
    
    // 画面外に出ないように制限
    player.x = Math.max(player.width/2, Math.min(canvas.width - player.width/2, targetX));
  }

  // スマホのタッチ操作
  controlSpace.addEventListener('touchstart', (e) => { movePlayer(e.touches[0].clientX); });
  controlSpace.addEventListener('touchmove', (e) => { 
    e.preventDefault(); // 画面スクロールを防止
    movePlayer(e.touches[0].clientX); 
  });

  // PCのマウス操作（ドラッグ中のみ移動）
  controlSpace.addEventListener('mousedown', (e) => { movePlayer(e.clientX); });
  controlSpace.addEventListener('mousemove', (e) => {
    if (e.buttons > 0) { // クリックしたまま動かした時
      movePlayer(e.clientX);
    }
  });


  // --------------------------------------------------
  // ゲームロジック
  // --------------------------------------------------
  function spawnObject() {
    const rand = Math.random();
    const x = Math.random() * (canvas.width - 30) + 15;
    
    if (rand < 0.4) {
      objects.push({ x: x, y: -50, radius: 15, type: 'manhole', color: '#888' });
    } else if (rand < 0.5) {
      objects.push({ x: x, y: -50, width: 25, height: 35, type: 'goshuin', color: '#ff2222' });
    } else if (rand < 0.6) {
      objects.push({ x: x, y: -50, radius: 12, type: 'drink', color: '#22ff22' });
    } else {
      objects.push({ x: x, y: -50, width: 40, height: 40, type: 'obstacle', color: '#111' });
    }
  }

  function checkCollision(obj) {
    // プレイヤーのY座標（画面下部から一定距離）
    const playerY = canvas.height - 80; 
    const px = player.x - player.width/2;
    const py = playerY - player.height/2;
    
    let ox, oy, ow, oh;
    if (obj.radius) {
      ox = obj.x - obj.radius; oy = obj.y - obj.radius;
      ow = obj.radius*2; oh = obj.radius*2;
    } else {
      ox = obj.x - obj.width/2; oy = obj.y - obj.height/2;
      ow = obj.width; oh = obj.height;
    }
    return (px < ox + ow && px + player.width > ox &&
            py < oy + oh && py + player.height > oy);
  }

  function update() {
    if (isGameOver) return;

    hp -= 0.05; // 息切れ
    if (frameCount % 600 === 0) gameSpeed += 0.5; // スピードアップ
    if (frameCount % 45 === 0) spawnObject(); // オブジェクト生成

    for (let i = objects.length - 1; i >= 0; i--) {
      let obj = objects[i];
      obj.y += gameSpeed;

      if (checkCollision(obj)) {
        if (obj.type === 'manhole') score += 100;
        if (obj.type === 'goshuin') score += 500;
        if (obj.type === 'drink') hp = Math.min(100, hp + 15);
        if (obj.type === 'obstacle') hp -= 20;
        
        objects.splice(i, 1);
      } else if (obj.y > canvas.height + 50) {
        objects.splice(i, 1);
      }
    }

    if (hp <= 0) {
      hp = 0;
      isGameOver = true;
      finalScoreText.innerText = score;
      gameOverScreen.style.display = 'block';
    }

    scoreText.innerText = score;
    hpText.innerText = Math.floor(hp);
    frameCount++;
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // プレイヤー描画（Y座標は画面下部固定）
    const playerY = canvas.height - 80;
    ctx.fillStyle = player.color;
    ctx.fillRect(player.x - player.width/2, playerY - player.height/2, player.width, player.height);

    // オブジェクト描画
    objects.forEach(obj => {
      ctx.fillStyle = obj.color;
      if (obj.radius) {
        ctx.beginPath();
        ctx.arc(obj.x, obj.y, obj.radius, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillRect(obj.x - obj.width/2, obj.y - obj.height/2, obj.width, obj.height);
      }
    });
  }

  function loop() {
    update();
    draw();
    if (!isGameOver) {
      requestAnimationFrame(loop);
    }
  }

  loop();
</script>
</body>
</html>
