<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>曇天ズ - ロゴ画像対応版（ChatGPT修正反映）</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background-color: #ffffff;
    font-family: sans-serif;
    height: 100dvh; 
    display: flex;
    flex-direction: column;
    overflow: hidden;
    touch-action: none; 
  }
  
  /* 上部ヘッダー */
  #header {
    display: flex;
    align-items: stretch;
    gap: 10px;
    padding: 10px;
    padding-top: calc(10px + env(safe-area-inset-top));
    height: calc(90px + env(safe-area-inset-top));
    box-sizing: border-box;
    flex-shrink: 0;
  }

  /* ロゴ専用エリア */
  .logo-box {
    flex: 1.3;
    min-width: 0;
    background-color: #fce25d;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding: 5px;
    box-sizing: border-box;
  }

  /* ロゴ画像 */
  .logo-box img {
    display: block;
    width: 100%;
    height: 100%;
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    object-position: center;
  }

  /* スコア表示 */
  .header-box {
    flex: 1;
    min-width: 0;
    background-color: #fce25d;
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 20px;
    color: #000;
  }

  .score-box {
    flex: 1;
  }

  .score-text {
    font-size: 16px;
    margin-top: 4px;
  }

  /* 中央ゲーム画面 */
  #game-wrapper {
    flex: 1;
    margin: 0 10px;
    background-color: #fce25d;
    border-radius: 8px;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    background-color: #fff8d6;
    display: block;
    width: 100%;
    height: 100%;
  }

  /* スタート（説明）画面 */
  #start-screen {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(252, 226, 93, 0.95);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: #333;
    z-index: 10;
  }
  #start-screen h2 {
    margin: 0 0 10px 0;
    font-size: 22px;
  }
  #start-screen p {
    font-size: 14px;
    margin: 0 0 15px 0;
    line-height: 1.4;
  }
  .item-desc {
    background: #fff;
    padding: 15px;
    border-radius: 8px;
    text-align: left;
    font-size: 14px;
    margin-bottom: 20px;
    line-height: 1.8;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
  }
  .icon-sample {
    display: inline-block;
    vertical-align: middle;
    margin-right: 5px;
  }
  .btn {
    padding: 12px 30px;
    font-size: 18px;
    font-weight: bold;
    background-color: #333;
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    box-shadow: 0 4px 0 #000;
  }
  .btn:active {
    transform: translateY(4px);
    box-shadow: none;
  }

  /* 下部操作スペース */
  #control-space {
    height: 120px;
    margin: 10px;
    background-color: #fce25d;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-weight: bold;
    color: #000;
    user-select: none;
    -webkit-user-select: none;
    cursor: pointer;
    box-sizing: border-box;
    padding-bottom: env(safe-area-inset-bottom);
    margin-bottom: calc(10px + env(safe-area-inset-bottom));
  }

  /* ゲームオーバー画面 */
  #gameover {
    display: none;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.8);
    color: white;
    padding: 20px;
    text-align: center;
    border-radius: 10px;
    width: 80%;
    z-index: 20;
  }
</style>
</head>
<body>

<!-- 上部ヘッダー -->
<div id="header">
  <div class="logo-box">
    <img src="logo.png" alt="曇天ズコレクト">
  </div>

  <div class="header-box score-box">
    <div>SCORE: <span id="scoreText">0</span></div>
    <div class="score-text">HP: <span id="hpText">100</span></div>
  </div>
</div>

<!-- 中央 -->
<div id="game-wrapper">
  <canvas id="gameCanvas"></canvas>
  
  <!-- スタート画面（説明） -->
  <div id="start-screen">
    <h2>遊び方</h2>
    <p>下の「操作スペース」を左右になぞって移動！<br>走ると体力が減るのでアイテムを取ろう。</p>
    
    <div class="item-desc">
      <div><span class="icon-sample" style="width:15px; height:15px; background:#888; border-radius:50%;"></span> <strong>マンホール:</strong> スコア +100</div>
      <div><span class="icon-sample" style="width:15px; height:20px; background:#ff2222;"></span> <strong>御朱印:</strong> スコア +500</div>
      <div><span class="icon-sample" style="width:15px; height:15px; background:#22ff22; border-radius:50%;"></span> <strong>ドリンク:</strong> 体力(HP)回復</div>
      <div><span class="icon-sample" style="width:15px; height:15px; background:#111;"></span> <strong>障害物:</strong> 体力ダメージ</div>
    </div>
    
    <button id="startButton" class="btn">スタート</button>
  </div>

  <div id="gameover">
    <h2>体力切れ...</h2>
    <p>最終スコア: <span id="finalScore"></span></p>
    <button class="btn" onclick="location.reload()" style="font-size:16px;">もう一度走る</button>
  </div>
</div>

<!-- 下部 -->
<div id="control-space">
  操作スペース<br>（左右になぞる）
</div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const gameWrapper = document.getElementById('game-wrapper');

  function resizeCanvas() {
    canvas.width = gameWrapper.clientWidth;
    canvas.height = gameWrapper.clientHeight;
  }
  setTimeout(resizeCanvas, 100);
  window.addEventListener('resize', () => {
      setTimeout(resizeCanvas, 100);
  });

  const scoreText = document.getElementById('scoreText');
  const hpText = document.getElementById('hpText');
  const gameOverScreen = document.getElementById('gameover');
  const startScreen = document.getElementById('start-screen');
  const startButton = document.getElementById('startButton');
  const finalScoreText = document.getElementById('finalScore');
  const controlSpace = document.getElementById('control-space');

  let isGameStarted = false;
  let isGameOver = false;
  let score = 0;
  let hp = 100;
  let frameCount = 0;
  let gameSpeed = 4;

  const player = {
    width: 40,
    height: 40,
    x: canvas.width / 2,
    color: '#0055ff'
  };

  let objects = [];

  startButton.addEventListener('click', () => {
    startScreen.style.display = 'none';
    player.x = canvas.width / 2;
    isGameStarted = true;
  });

  function movePlayer(clientX) {
    if (!isGameStarted || isGameOver) return; 
    const rect = controlSpace.getBoundingClientRect();
    let relativeX = clientX - rect.left;
    let ratio = relativeX / rect.width;
    let targetX = ratio * canvas.width;
    player.x = Math.max(player.width/2, Math.min(canvas.width - player.width/2, targetX));
  }

  controlSpace.addEventListener('touchstart', (e) => { movePlayer(e.touches[0].clientX); }, {passive: false});
  controlSpace.addEventListener('touchmove', (e) => { 
    e.preventDefault(); 
    movePlayer(e.touches[0].clientX); 
  }, {passive: false});
  controlSpace.addEventListener('mousedown', (e) => { movePlayer(e.clientX); });
  controlSpace.addEventListener('mousemove', (e) => {
    if (e.buttons > 0) movePlayer(e.clientX);
  });

  function spawnObject() {
    const rand = Math.random();
    const x = Math.random() * (canvas.width - 30) + 15;
    
    if (rand < 0.4) {
      objects.push({ x: x, y: -50, radius: 15, type: 'manhole', color: '#888' });
    } else if (rand < 0.5) {
      objects.push({ x: x, y: -50, width: 25, height: 35, type: 'goshuin', color: '#ff2222' });
    } else if (rand < 0.6) {
      objects.push({ x: x, y: -50, radius: 12, type: 'drink', color: '#22ff22' });
    } else {
      objects.push({ x: x, y: -50, width: 40, height: 40, type: 'obstacle', color: '#111' });
    }
  }

  function checkCollision(obj) {
    const playerY = canvas.height - 80; 
    const px = player.x - player.width/2;
    const py = playerY - player.height/2;
    
    let ox, oy, ow, oh;
    if (obj.radius) {
      ox = obj.x - obj.radius; oy = obj.y - obj.radius;
      ow = obj.radius*2; oh = obj.radius*2;
    } else {
      ox = obj.x - obj.width/2; oy = obj.y - obj.height/2;
      ow = obj.width; oh = obj.height;
    }
    return (px < ox + ow && px + player.width > ox &&
            py < oy + oh && py + player.height > oy);
  }

  function update() {
    if (!isGameStarted || isGameOver) return; 

    hp -= 0.05;
    if (frameCount % 600 === 0) gameSpeed += 0.5;
    if (frameCount % 45 === 0) spawnObject();

    for (let i = objects.length - 1; i >= 0; i--) {
      let obj = objects[i];
      obj.y += gameSpeed;

      if (checkCollision(obj)) {
        if (obj.type === 'manhole') score += 100;
        if (obj.type === 'goshuin') score += 500;
        if (obj.type === 'drink') hp = Math.min(100, hp + 15);
        if (obj.type === 'obstacle') hp -= 20;
        
        objects.splice(i, 1);
      } else if (obj.y > canvas.height + 50) {
        objects.splice(i, 1);
      }
    }

    if (hp <= 0) {
      hp = 0;
      isGameOver = true;
      finalScoreText.innerText = score;
      gameOverScreen.style.display = 'block';
    }

    scoreText.innerText = score;
    hpText.innerText = Math.floor(hp);
    frameCount++;
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const playerY = canvas.height - 80;
    ctx.fillStyle = player.color;
    ctx.fillRect(player.x - player.width/2, playerY - player.height/2, player.width, player.height);

    objects.forEach(obj => {
      ctx.fillStyle = obj.color;
      if (obj.radius) {
        ctx.beginPath();
        ctx.arc(obj.x, obj.y, obj.radius, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillRect(obj.x - obj.width/2, obj.y - obj.height/2, obj.width, obj.height);
      }
    });
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  loop();
</script>
</body>
</html>
